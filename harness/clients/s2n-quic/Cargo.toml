[package]
name = "qth-client-s2n"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# rustls verifies Ed25519, ECDSA P-256 and RSA-PSS server certificates; the
# s2n-tls provider has no Ed25519.
# s2n-quic 1.92 does not compile without its default address token provider.
s2n-quic = { version = "=1.92.0", default-features = false, features = [
    "provider-address-token-default",
    "provider-tls-rustls",
] }
# The rustls and webpki that s2n-quic-rustls uses; the client installs its own
# certificate verifier.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
